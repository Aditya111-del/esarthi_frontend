<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ESARTHI — Workforce Management System</title>
    <meta name="description" content="ESARTHI — Enterprise workforce management. Employee directory, shop operations, onboarding, and analytics for multi-branch teams." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Fonts: preconnect for speed, then load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Critical CSS to prevent flash of unstyled content & hide scrollbars -->
    <style>
      html { background: #0b0e14; color: #f8fafc; }
      body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
      #root { min-height: 100vh; }
      html, body, *, ::before, ::after { scrollbar-width: none !important; -ms-overflow-style: none !important; }
      ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
